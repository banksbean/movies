<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bend Movies</title>
<meta name="description" content="What's playing in Bend at Regal Old Mill, Tin Pan Theater and McMenamins Old St. Francis: timeline, month view, showtimes, trailers and Rotten Tomatoes scores.">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#1d1a17; --muted:#6f675e; --line:#e4ddd2; --soft:#efe9df;
  --accent:#c2410c; --accent-ink:#fff; --accent-soft:#fde7d9; --bar:#2f2a25; --bar2:#8a7f73;
  --event:#7c3aed; --classic:#0f766e; --fresh:#16a34a; --rotten:#b45309; --today:#c2410c;
  --th0:#2563eb; --th1:#be123c; --th2:#a16207;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210; --panel:#1c1916; --ink:#f1ebe3; --muted:#a59b8f; --line:#2e2924; --soft:#24201c;
  --accent:#fb7c3c; --accent-ink:#1a0d05; --accent-soft:#3a2216; --bar:#e9e1d6; --bar2:#7d7368;
  --event:#a78bfa; --classic:#2dd4bf; --fresh:#4ade80; --rotten:#f59e0b; --today:#fb7c3c; --shadow:none;
  --th0:#60a5fa; --th1:#fb7185; --th2:#facc15;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 0 8px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand b{font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px}
.filters{display:flex;gap:6px;align-items:center;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:999px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:0 1 220px;min-width:140px;border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:999px;font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.sep{width:1px;height:20px;background:var(--line);flex:none}
main{padding:14px 0 60px}
.banner{display:none;margin:0 0 12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:14px}
.banner.show{display:block}
.banner b{color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.toolbar h2{font-size:18px;margin:0 auto 0 0;font-weight:650}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.nav{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:30px;font-size:16px;line-height:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.rt{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;text-decoration:none;white-space:nowrap}
.rt.fresh{background:color-mix(in srgb,var(--fresh) 16%,transparent);color:var(--fresh)}
.rt.rotten{background:color-mix(in srgb,var(--rotten) 16%,transparent);color:var(--rotten)}
.rt.none{color:var(--muted);font-weight:500;background:var(--soft)}
.kind{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px}
.kind.event{color:var(--event);background:color-mix(in srgb,var(--event) 13%,transparent)}
.kind.classic{color:var(--classic);background:color-mix(in srgb,var(--classic) 13%,transparent)}
.star{border:0;background:none;font-size:17px;line-height:1;padding:2px 4px;color:var(--muted)}
/* theatres: one color each */
.th0{--th:var(--th0)} .th1{--th:var(--th1)} .th2{--th:var(--th2)}
.chip.thc{display:inline-flex;align-items:center;gap:6px}
.chip.thc i{width:9px;height:9px;border-radius:50%;background:var(--th);flex:none}
.chip.thc:not(.on){opacity:.55;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip.thc.on{background:color-mix(in srgb,var(--th) 16%,var(--panel));color:var(--ink);border-color:var(--th)}
.thb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;color:var(--th);background:color-mix(in srgb,var(--th) 13%,transparent);white-space:nowrap}
.thd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--th);flex:none}
.throw{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
.throw:first-child{margin-top:0}
.throw>.thb{margin-top:7px;flex:none;width:108px;justify-content:center}
@media (max-width:760px){.throw{flex-direction:column;gap:4px}.throw>.thb{margin-top:0;width:auto}}
.time.th0,.time.th1,.time.th2{border-left:3px solid var(--th)}
.star.on{color:var(--accent)}

/* timeline */
.tl{overflow:auto;position:relative;overscroll-behavior:contain}
body.tlmode main{padding-bottom:0}
body.tlmode footer{display:none}
body.tlmode .legend{margin:0}
.tl table{border-collapse:separate;border-spacing:0;table-layout:fixed}
.tl th,.tl td{padding:0;border-bottom:1px solid var(--line)}
.tl thead th{position:sticky;top:0;z-index:3;background:var(--panel);font-weight:500;font-size:11px;color:var(--muted);height:46px;vertical-align:bottom;padding-bottom:4px}
.tl .name{position:sticky;left:0;z-index:2;background:var(--panel);min-width:250px;max-width:250px;border-right:1px solid var(--line);text-align:left}
.tl thead .name{z-index:4;padding-left:12px}
.tl .row{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;cursor:pointer;height:46px}
.tl .row img{width:24px;height:36px;object-fit:cover;border-radius:3px;background:var(--soft);flex:none}
.tl .row .t{flex:1;min-width:0}
.tl .row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;font-weight:550}
.tl .row .t small{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden}
.tl .day{min-width:var(--dw);max-width:var(--dw);text-align:center;position:relative}
.tl .day.we{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tl thead th.day{position:sticky;top:0;z-index:3}
.tl thead .day b{display:block;font-size:12px;color:var(--ink);font-weight:600}
.tl thead .day.today b{color:var(--today)}
.tl thead .day.m1{border-left:2px solid var(--ink)}
.tl tbody .day.m1{border-left:2px solid var(--line)}
.tl .mlab{position:absolute;left:3px;top:2px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tl .cell{position:absolute;inset:14px 0;cursor:pointer}
.tl .cell.on{background:var(--bar);opacity:var(--o,.85)}
.tl .cell.on.s{border-top-left-radius:6px;border-bottom-left-radius:6px;margin-left:2px}
.tl .cell.on.e{border-top-right-radius:6px;border-bottom-right-radius:6px;margin-right:2px}
.tl tr.k-event .cell.on{background:var(--event)}
.tl tr.k-classic .cell.on{background:var(--classic)}
.tl .cell.on:hover{outline:2px solid var(--accent);z-index:1}
.tl .todayline{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--today);opacity:.5;pointer-events:none}
.tl tr:hover .name{background:var(--soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.month .dow{background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;font-weight:600}
.month .c{background:var(--panel);min-height:122px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.month .c.out{background:var(--bg);opacity:.55}
.month .c.empty{cursor:default}
.month .c:hover:not(.empty){background:var(--soft)}
.month .c .d{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:650}
.month .c .d small{font-weight:500;font-size:11px;color:var(--muted)}
.month .c.today .d span{background:var(--today);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.month .it{font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 5px;border-radius:4px;background:var(--soft)}
.month .it.new{background:var(--accent-soft);font-weight:600}
.month .it.k-event{color:var(--event);background:color-mix(in srgb,var(--event) 10%,transparent)}
.month .it.k-classic{color:var(--classic);background:color-mix(in srgb,var(--classic) 10%,transparent)}
.month .it.plan{outline:1.5px solid var(--accent)}
.month .it .thd{width:6px;height:6px;margin-right:3px;vertical-align:1px}
.month .more{font-size:11px;color:var(--muted);padding-left:5px}
.month .dots{display:none}

/* day */
.dates{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.dates button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 0;width:54px;text-align:center;scroll-snap-align:start}
.dates button small{display:block;font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.dates button b{display:block;font-size:17px}
.dates button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dates button.on small{color:inherit;opacity:.75}
.dates button.mstart{margin-left:10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.film{display:flex;gap:12px;padding:10px}
.film img{width:66px;height:99px;object-fit:cover;border-radius:6px;background:var(--soft);flex:none;cursor:pointer}
.film .b{flex:1;min-width:0}
.film h3{margin:0;font-size:15.5px;line-height:1.25;cursor:pointer}
.film h3:hover{color:var(--accent)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:3px 0 7px}
.times{display:flex;flex-wrap:wrap;gap:6px}
.time{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;font-size:13.5px;font-weight:600;position:relative;text-align:center;line-height:1.15}
.time small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.time:hover{border-color:var(--accent);color:var(--accent)}
.time.plan{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.time.plan small{color:inherit;opacity:.85}
.time.past{opacity:.4}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.show{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:760px;width:100%;max-height:calc(100vh - 40px);overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .x{position:absolute;top:10px;right:10px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:18px;z-index:2}
.mhead{display:flex;gap:16px;padding:18px}
.mhead img{width:130px;height:195px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
.mhead h2{margin:0 36px 4px 0;font-size:21px;line-height:1.2}
.mhead p{margin:8px 0 0;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.mbody{padding:0 18px 18px}
.mbody h4{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:12px;width:270px;display:none}
.pop.show{display:block}
.pop h5{margin:0 0 2px;font-size:14px}
.pop .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.pop .btn{width:100%;justify-content:center;margin-top:6px}
.pop .row2{display:flex;gap:6px}
.pop .row2 .btn{flex:1}

/* plans */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pgrid section{padding:14px}
.pgrid h3{margin:0 0 10px;font-size:15px}
.pitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pitem:first-of-type{border-top:0}
.pitem img{width:36px;height:54px;object-fit:cover;border-radius:4px;background:var(--soft)}
.pitem .b{flex:1;min-width:0}
.pitem .b div{font-weight:600;font-size:14px;cursor:pointer}
.pitem .b small{color:var(--muted);font-size:12.5px}
.pitem .when{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.pitem select{font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px}
.empty-note{color:var(--muted);font-size:14px;padding:8px 0}
textarea.note{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;font-size:13px;padding:4px 6px;resize:vertical;margin-top:4px}
footer{color:var(--muted);font-size:12px;padding:20px 0 30px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:760px){
  .wrap{padding:0 10px}
  .brand b{font-size:16px}
  .brand span{display:none}
  .tabs button{padding:6px 9px;font-size:13px}
  .tl .name{min-width:132px;max-width:132px}
  .tl .row{padding:4px 6px;gap:6px;height:44px}
  .tl .row img{display:none}
  .tl .row .t div{font-size:12.5px}
  .month .c{min-height:62px;padding:4px 3px}
  .month .it,.month .more{display:none}
  .month .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
  .month .dots i{width:6px;height:6px;border-radius:50%;background:var(--bar2)}
  .month .dots i.new{background:var(--accent)}
  .month .dots i.k-event{background:var(--event)}
  .month .dots i.k-classic{background:var(--classic)}
  .month .dots i.plan{background:var(--accent);outline:1.5px solid var(--accent);outline-offset:1px}
  .month .c .d small{display:none}
  .month .dow{padding:5px 4px;text-align:center}
  .list{grid-template-columns:1fr}
  .scrim{padding:0;align-items:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:92vh}
  .mhead{padding:14px}
  .mhead img{width:92px;height:138px}
  .mhead h2{font-size:18px}
  .pgrid{grid-template-columns:1fr}
  .pop{left:10px!important;right:10px;width:auto;bottom:10px;top:auto!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><b>Bend Movies</b><span id="sub">Bend movie theaters</span></div>
      <nav class="tabs" id="tabs">
        <button data-v="timeline">Timeline</button>
        <button data-v="month">Month</button>
        <button data-v="day">Day</button>
        <button data-v="plans">Plans<span class="count" id="pcount" hidden></span></button>
      </nav>
    </div>
    <div class="filters" id="filters">
      <input class="search" id="q" type="search" placeholder="Search titles, cast…" autocomplete="off">
      <span class="sep"></span>
      <span id="thchips" style="display:contents"></span>
      <span class="sep"></span>
      <button class="chip" data-k="film">New films</button>
      <button class="chip" data-k="classic">Classics</button>
      <button class="chip" data-k="event">Events &amp; live</button>
      <span class="sep"></span>
      <button class="chip" data-f="fresh">RT 70%+</button>
      <button class="chip" data-f="starred">★ Starred</button>
      <button class="chip" data-f="pla">IMAX / 3D</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>
<footer class="wrap" id="foot"></footer>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const PREVIEWS=20; // minutes of trailers before the feature, for calendar end times

// ---------- local store (per browser; nothing leaves the device) ----------
const KEY="oldmill.v1";
const store=(()=>{let s;try{s=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){s={}}
  s.star=s.star||{}; s.plans=s.plans||{}; s.ui=s.ui||{}; return s})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){} updateCount()}

// ---------- data ----------
let D=null, M=[], S=[], ALL=[], byDate={}, byMovie={}, perf={}, TH=[];
const state={view:store.ui.view||"timeline", range:store.ui.range||"2w", kinds:new Set(store.ui.kinds||[]), flags:new Set(store.ui.flags||[]), thOff:new Set(store.ui.thOff||[]), q:"", day:null, month:null};

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
// "today" in Bend, regardless of the viewer's own time zone
function bendNow(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return g("year")+"-"+g("month")+"-"+g("day")+"T"+g("hour").replace("24","00")+":"+g("minute")}
const TODAY=()=>bendNow().slice(0,10);
function t12(local){let [h,m]=local.slice(11,16).split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+String(m).padStart(2,"0")+ap}
function niceDate(s,long){const d=parseYmd(s);return (long?["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]:DOW[d.getDay()])+", "+MON[d.getMonth()]+" "+d.getDate()}
function rtBadge(m){if(!m.rt)return m.rtUrl?`<a class="rt none" href="${esc(m.rtUrl)}" target="_blank" rel="noopener" title="Rotten Tomatoes: no score yet">RT –</a>`:"";
  const n=+m.rt, cls=n>=60?"fresh":"rotten";return `<a class="rt ${cls}" href="${esc(m.rtUrl)}" target="_blank" rel="noopener" title="Rotten Tomatoes Tomatometer">${n>=60?"🍅 ":""}${n}%</a>`}
function isNew(m,d){return m.kind==="film"&&m.first===d&&m.opens>=ymd(addDays(parseYmd(m.first),-1))}
function kindTag(m){return m.kind==="film"?"":`<span class="kind ${m.kind}">${m.kind==="event"?"Event":"Classic"}</span>`}
function runtime(m){return m.runtime?Math.floor(m.runtime/60)+"h "+(m.runtime%60)+"m":""}
function rating(m){return m.rating?m.rating.replace("PG13","PG-13").replace("NC17","NC-17"):""}
function bookUrl(s){const l=D.links[s.slug]; if(/^https?:/.test(l)) return l;
  return `https://www.regmovies.com/movies/${l}?site=${TH[s.th].code}&id=${s.perf}&date=${s.local.slice(5,7)}-${s.local.slice(8,10)}-${s.local.slice(0,4)}`}
// theatre helpers
const thName=s=>TH[s.th].name, thShort=i=>TH[i].short||TH[i].name;
function thBadge(i){return `<span class="thb th${i}" title="${esc(TH[i].name)}">${esc(thShort(i))}</span>`}
function thDots(m){return (m.theatres||[0]).filter(i=>!state.thOff.has(TH[i].id)).map(i=>`<span class="thd th${i}" title="${esc(TH[i].name)}"></span>`).join("")}
function thOn(i){return !state.thOff.has(TH[i].id)}
function bookLabel(s){return s.th===0?"🎟 Book on Regal":`🎟 Tickets at ${thShort(s.th)}`}
function audText(s){return s.aud!==""&&s.aud!=null?`Auditorium ${s.aud}`:""}
function multiTh(){return TH.filter((_,i)=>thOn(i)).length>1}
function trailerUrl(m){return m.trailer||("https://www.youtube.com/results?search_query="+encodeURIComponent(m.title.replace(/^CUT26:\s*/,"")+" trailer"))}

function ingest(d){
  if(!d.theatres){d.theatres=[Object.assign({id:"regal",short:"Old Mill"},d.theatre)]; d.links=d.slugs; d.movies.forEach(m=>{m.theatres=[0];m.pages=[[0,m.regal]]})} // older data format
  D=d; M=d.movies; TH=d.theatres; perf={};
  ALL=d.shows.map(a=>({m:a[0],local:a[1],utc:a[2],aud:a[3],tags:a[4],slug:a[5],perf:String(a[6]),th:a[7]||0}));
  const now=bendNow();
  ALL=ALL.filter(s=>s.local>=now.slice(0,10));
  for(const s of ALL) perf[s.perf]=s;
  M.forEach((m,i)=>{m.i=i; m.hay=(m.title+" "+m.cast+" "+m.directors+" "+m.genre+" "+(m.theatres||[]).map(j=>TH[j].name).join(" ")).toLowerCase()});
  applyTheatres();
  const lasts=M.filter(m=>m.kind==="film"&&m.days>=3).map(m=>m.last).sort(); D.horizon=lasts[Math.floor(lasts.length/2)]||"9999";
  $("#sub").textContent=`Bend · ${TH.map(t=>t.short).join(" · ")} · updated ${niceDate(d.updated.slice(0,10))}`;
  $("#foot").innerHTML=`Showtimes from ${TH.map(t=>`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a> (${esc(t.address)})`).join(", ")}, refreshed weekly; last build ${esc(d.updated.replace("T"," "))} Pacific. Times can change after a refresh, so each theater's own page is the final word. Scores from Rotten Tomatoes. Stars and plans are saved only in this browser. Works offline once loaded.`;
  $("#thchips").innerHTML=TH.map((t,i)=>`<button class="chip thc th${i}" data-th="${esc(t.id)}" title="Show or hide ${esc(t.name)}"><i></i>${esc(t.short)}</button>`).join("");
  $$("#thchips .chip").forEach(b=>b.onclick=()=>{const id=b.dataset.th;
    if(state.thOff.has(id)) state.thOff.delete(id); else {state.thOff.add(id); if(state.thOff.size>=TH.length){state.thOff.clear();toast("Showing all theaters")}}
    applyTheatres(); render()});
}
// Rebuild the per-day and per-movie indexes from the theatres switched on.
function applyTheatres(){
  byDate={}; byMovie={};
  S=ALL.filter(s=>thOn(s.th));
  for(const s of S){(byDate[s.local.slice(0,10)] ||= []).push(s);(byMovie[s.m] ||= []).push(s)}
  M.forEach((m,i)=>{m.big=(byMovie[i]||[]).some(s=>/IMAX|3D|ScreenX/.test(s.tags))});
}

function visible(m){
  if(state.kinds.size && !state.kinds.has(m.kind)) return false;
  if(state.flags.has("fresh") && !(+m.rt>=70)) return false;
  if(state.flags.has("starred") && !store.star[m.id]) return false;
  if(state.flags.has("pla") && !m.big) return false;
  if(state.q && !m.hay.includes(state.q)) return false;
  return !!byMovie[m.i];
}

// ---------- reminders / banner ----------
function plannedShows(){return Object.keys(store.plans).map(p=>({p,s:perf[p],x:store.plans[p]})).filter(o=>o.s).sort((a,b)=>a.s.utc-b.s.utc)}
function relDays(day){const n=Math.round((parseYmd(day)-parseYmd(TODAY()))/864e5);return n===0?"today":n===1?"tomorrow":n<0?`${-n}d ago`:n<7?`in ${n} days`:`in ${Math.round(n/7)} wk`}
function reminders(){
  const out=[], today=TODAY(), nowSec=Date.now()/1000;
  for(const o of plannedShows()){const h=(o.s.utc-nowSec)/3600; if(h>-1&&h<36) out.push(`<b>${esc(M[o.s.m].title)}</b> ${relDays(o.s.local.slice(0,10))} at ${t12(o.s.local)}`)}
  for(const id in store.star){const m=M.find(x=>x.id===id); if(!m||!byMovie[m.i]) continue; const r=store.star[id];
    const first=byMovie[m.i][0].local.slice(0,10), last=m.last, lead=+(r.lead??3);
    const dOpen=(parseYmd(first)-parseYmd(today))/864e5, dLast=(parseYmd(last)-parseYmd(today))/864e5;
    if(dOpen>0&&dOpen<=lead) out.push(`<b>${esc(m.title)}</b> starts ${relDays(first)}`);
    else if(m.kind==="film"&&m.days>3&&dLast>=0&&dLast<=2&&m.last<D.horizon) out.push(`<b>${esc(m.title)}</b> last listed showing ${relDays(last)}`);}
  const b=$("#banner"); b.innerHTML=out.length?"⏰ "+out.join(" · "):""; b.classList.toggle("show",!!out.length);
}
function updateCount(){const n=plannedShows().filter(o=>o.s.utc>Date.now()/1000).length+Object.keys(store.star).length;const c=$("#pcount");c.hidden=!n;c.textContent=n}

// ---------- views ----------
function render(){
  $$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.view));
  document.body.classList.toggle("tlmode",state.view==="timeline"); if(state.view==="timeline") scrollTo(0,0);
  $$("#filters .chip").forEach(b=>b.classList.toggle("on",b.dataset.th?!state.thOff.has(b.dataset.th):(state.kinds.has(b.dataset.k)||state.flags.has(b.dataset.f))));
  store.ui={view:state.view,range:state.range,kinds:[...state.kinds],flags:[...state.flags],thOff:[...state.thOff]}; save();
  ({timeline:vTimeline,month:vMonth,day:vDay,plans:vPlans})[state.view]();
  reminders(); if(state.view==="timeline") fitTimeline();
}

function vTimeline(){
  const today=TODAY(), lastShow=S.length?S[S.length-1].local.slice(0,10):today;
  const spans={"2w":14,"6w":42,"3m":92,"all":Math.max(14,Math.round((parseYmd(lastShow)-parseYmd(today))/864e5)+1)};
  const n=spans[state.range], start=parseYmd(today), days=[...Array(n)].map((_,i)=>ymd(addDays(start,i))), end=days[days.length-1];
  const dw=state.range==="2w"?(innerWidth<760?40:52):state.range==="6w"?(innerWidth<760?24:26):(innerWidth<760?14:12);
  const ms=M.filter(visible).filter(m=>byMovie[m.i].some(s=>s.local.slice(0,10)<=end)).sort((a,b)=>(a.first.localeCompare(b.first))||(b.shows-a.shows));
  let h=`<div class="toolbar"><h2>What's playing, day by day</h2><div class="legend"><span><i style="background:var(--bar)"></i>Film</span><span><i style="background:var(--classic)"></i>Classic</span><span><i style="background:var(--event)"></i>Event</span>${thLegend()}</div><div class="seg" id="range">${[["2w","2 weeks"],["6w","6 weeks"],["3m","3 months"],["all","All"]].map(([k,l])=>`<button data-r="${k}" class="${state.range===k?"on":""}">${l}</button>`).join("")}</div></div>`;
  const nw=innerWidth<760?132:250;
  h+=`<div class="card tl" style="--dw:${dw}px"><table style="width:${nw+n*dw}px"><colgroup><col style="width:${nw}px">${`<col style="width:${dw}px">`.repeat(n)}</colgroup><thead><tr><th class="name">${ms.length} titles</th>`;
  days.forEach((d,i)=>{const x=parseYmd(d),we=x.getDay()%6===0,m1=x.getDate()===1||i===0;
    h+=`<th class="day${we?" we":""}${d===today?" today":""}${x.getDate()===1?" m1":""}">${m1?`<span class="mlab">${MON[x.getMonth()]}</span>`:""}${dw>=20||x.getDay()===1?`<b>${x.getDate()}</b>`:""}${dw>=24?DOW[x.getDay()][0]:""}</th>`});
  h+=`</tr></thead><tbody>`;
  for(const m of ms){
    const cnt={}; byMovie[m.i].forEach(s=>{const d=s.local.slice(0,10);cnt[d]=(cnt[d]||0)+1});
    const mx=Math.max(...Object.values(cnt));
    h+=`<tr class="k-${m.kind}"><td class="name"><div class="row" data-m="${m.i}"><img loading="lazy" src="${esc(m.poster)}" alt=""><div class="t"><div title="${esc(m.title)}">${store.star[m.id]?"★ ":""}${esc(m.title)}</div><small>${thDots(m)}${rtBadge(m)}${kindTag(m)}<span>${rating(m)}</span></small></div></div></td>`;
    days.forEach((d,i)=>{const x=parseYmd(d),we=x.getDay()%6===0,c=cnt[d];
      const s=c&&!cnt[days[i-1]],e=c&&!cnt[days[i+1]];
      h+=`<td class="day${we?" we":""}${x.getDate()===1?" m1":""}">${c?`<div class="cell on${s?" s":""}${e?" e":""}" style="--o:${(.45+.55*c/mx).toFixed(2)}" data-m="${m.i}" data-d="${d}" title="${esc(m.title)} · ${niceDate(d)} · ${c} show${c>1?"s":""}${multiTh()?" · "+[...new Set(byMovie[m.i].filter(s=>s.local.startsWith(d)).map(s=>thShort(s.th)))].join(", "):""}"></div>`:""}${d===today?'<div class="todayline"></div>':""}</td>`});
    h+=`</tr>`;
  }
  if(!ms.length) h+=`<tr><td class="name" style="padding:14px" colspan="${n+1}">Nothing matches these filters.</td></tr>`;
  h+=`</tbody></table></div>`;
  $("#view").innerHTML=h;
  fitTimeline(); const tl=$(".tl"); if(tl&&state.tlScroll) tl.scrollTop=state.tlScroll; if(tl) tl.onscroll=()=>{state.tlScroll=tl.scrollTop};
  $$("#range button").forEach(b=>b.onclick=()=>{state.range=b.dataset.r;render()});
  $$(".tl .row").forEach(r=>r.onclick=()=>openMovie(+r.dataset.m));
  $$(".tl .cell").forEach(c=>c.onclick=()=>openMovie(+c.dataset.m,c.dataset.d));
}

// Size the timeline to the rest of the viewport so the page itself doesn't scroll: the date row then stays pinned.
function fitTimeline(){const t=$(".tl"); if(!t) return; t.style.height=Math.max(260,innerHeight-t.getBoundingClientRect().top-scrollY*0-10)+"px"}
addEventListener("resize",()=>{if(state.view==="timeline") fitTimeline()});
function vMonth(){
  const today=TODAY(); if(!state.month) state.month=today.slice(0,7);
  const [Y,Mo]=state.month.split("-").map(Number), first=new Date(Y,Mo-1,1), start=addDays(first,-first.getDay());
  const last=new Date(Y,Mo,0), cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
  const minM=today.slice(0,7), maxM=S.length?S[S.length-1].local.slice(0,7):minM;
  const plannedDays={}; plannedShows().forEach(o=>{(plannedDays[o.s.local.slice(0,10)] ||= new Set()).add(o.s.m)});
  let h=`<div class="toolbar"><button class="nav" id="mprev" ${state.month<=minM?"disabled":""}>‹</button><h2 style="margin:0 6px;flex:0 0 auto">${MONL[Mo-1]} ${Y}</h2><button class="nav" id="mnext" ${state.month>=maxM?"disabled":""}>›</button><span style="margin-left:auto" class="muted">Highlighted: openings, events and your plans. Tap a day for showtimes.</span></div><div class="month">`;
  h+=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<cells;i++){
    const x=addDays(start,i), d=ymd(x), out=x.getMonth()!==Mo-1;
    const list=(byDate[d]||[]), ids=[...new Set(list.map(s=>s.m))].map(j=>M[j]).filter(visible);
    if(!ids.length){h+=`<div class="c empty${out?" out":""}${d===today?" today":""}"><div class="d"><span>${x.getDate()}</span></div></div>`;continue}
    const pl=plannedDays[d]||new Set();
    const indie=m=>list.some(s=>s.m===m.i&&s.th!==0);
    const score=m=>(pl.has(m.i)?0:isNew(m,d)?1:m.kind!=="film"?2:store.star[m.id]?3:indie(m)?3.5:4);
    ids.sort((a,b)=>score(a)-score(b)||b.shows-a.shows);
    const shown=ids.filter(m=>score(m)<4).slice(0,5), rest=ids.length-shown.length;
    h+=`<div class="c${out?" out":""}${d===today?" today":""}" data-d="${d}"><div class="d"><span>${x.getDate()}</span><small>${ids.length} titles</small></div>`;
    const dayTh=m=>multiTh()?[...new Set(list.filter(s=>s.m===m.i).map(s=>s.th))].map(t=>`<span class="thd th${t}"></span>`).join(""):"";
    h+=shown.map(m=>`<div class="it ${pl.has(m.i)?"plan ":""}${isNew(m,d)?"new":"k-"+m.kind}" title="${esc(m.title)}">${dayTh(m)}${pl.has(m.i)?"● ":isNew(m,d)?"New: ":""}${esc(m.title.replace(/^CUT26:\s*/,""))}</div>`).join("");
    if(rest) h+=`<div class="more">+${rest} ${shown.length?"more ":""}playing</div>`;
    h+=`<div class="dots">${ids.slice(0,12).map(m=>`<i class="${pl.has(m.i)?"plan":isNew(m,d)?"new":"k-"+m.kind}"></i>`).join("")}</div></div>`;
  }
  h+=`</div><div class="legend"><span><i style="background:var(--accent)"></i>Opening day / your plan</span><span><i style="background:var(--classic)"></i>Classic</span><span><i style="background:var(--event)"></i>Event</span><span><i style="background:var(--bar2)"></i>Other films</span>${thLegend()}</div>`;
  $("#view").innerHTML=h;
  const shift=n=>{const d=new Date(Y,Mo-1+n,1);state.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()};
  $("#mprev").onclick=()=>shift(-1); $("#mnext").onclick=()=>shift(1);
  $$(".month .c[data-d]").forEach(c=>c.onclick=()=>{state.day=c.dataset.d;state.view="day";render();scrollTo(0,0)});
}

function vDay(){
  const days=Object.keys(byDate).sort(); if(!days.length){$("#view").innerHTML="<p>No showtimes loaded.</p>";return}
  if(!state.day||!byDate[state.day]) state.day=days.find(d=>d>=TODAY())||days[0];
  const d=state.day, nowSec=Date.now()/1000;
  let h=`<div class="dates" id="dates">${days.map((x,i)=>{const dt=parseYmd(x),ms=i&&x.slice(0,7)!==days[i-1].slice(0,7);return `<button data-d="${x}" class="${x===d?"on":""}${ms?" mstart":""}"><small>${x===TODAY()?"Today":DOW[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${MON[dt.getMonth()]}</small></button>`}).join("")}</div>`;
  const groups={}; byDate[d].forEach(s=>{(groups[s.m] ||= []).push(s)});
  const ms=Object.keys(groups).map(Number).map(i=>M[i]).filter(visible).sort((a,b)=>(!!store.star[b.id]-!!store.star[a.id])||(+(b.rt||0)-+(a.rt||0))||a.title.localeCompare(b.title));
  h+=`<div class="toolbar"><h2>${niceDate(d,true)}</h2><span class="muted">${ms.length} titles · tap a time to book, plan or add to calendar</span></div><div class="list">`;
  for(const m of ms){
    h+=`<div class="card film"><img loading="lazy" src="${esc(m.poster)}" alt="" data-m="${m.i}"><div class="b"><h3 data-m="${m.i}">${esc(m.title)}</h3><div class="meta">${rtBadge(m)}${kindTag(m)}<span>${[rating(m),runtime(m),m.genre].filter(Boolean).join(" · ")}</span><button class="star ${store.star[m.id]?"on":""}" data-star="${m.id}" title="Star: remind me">${store.star[m.id]?"★":"☆"}</button></div>${timesByTheatre(groups[m.i],nowSec)}</div></div>`;
  }
  if(!ms.length) h+=`<p class="muted">Nothing matches these filters on this day.</p>`;
  h+=`</div>`;
  $("#view").innerHTML=h;
  const on=$("#dates .on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  $$("#dates button").forEach(b=>b.onclick=()=>{state.day=b.dataset.d;render()});
  bindCommon();
}
// Times grouped under a badge per theatre, so a film playing at two places is never ambiguous.
function timesByTheatre(list,nowSec){
  const by={}; list.forEach(s=>{(by[s.th] ||= []).push(s)});
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(t=>`<div class="throw">${thBadge(t)}<div class="times">${by[t].map(s=>timeBtn(s,nowSec)).join("")}</div></div>`).join("");
}
function thLegend(){return multiTh()?TH.map((t,i)=>thOn(i)?`<span><span class="thd th${i}" style="margin-right:5px"></span>${esc(t.short)}</span>`:"").join(""):""}
function timeBtn(s,nowSec){return `<button class="time th${s.th}${store.plans[s.perf]?" plan":""}${s.utc<nowSec?" past":""}" data-p="${s.perf}" title="${esc(thName(s))}">${t12(s.local)}${s.tags?`<small>${esc(s.tags.replace("Open caption","OC").replace("Sensory friendly","Sensory"))}</small>`:""}</button>`}

function vPlans(){
  const nowSec=Date.now()/1000, ps=plannedShows(), up=ps.filter(o=>o.s.utc>nowSec-3*3600);
  const stars=Object.keys(store.star).map(id=>M.find(m=>m.id===id)).filter(Boolean).sort((a,b)=>(byMovie[a.i]?.[0]?.local||"9").localeCompare(byMovie[b.i]?.[0]?.local||"9"));
  let h=`<div class="toolbar"><h2>Your plans & reminders</h2><button class="btn" id="icsall" ${up.length?"":"disabled"}>📅 All plans to calendar</button><button class="btn" id="share" ${up.length||stars.length?"":"disabled"}>🔗 Share with friends</button></div><div class="pgrid">`;
  h+=`<section class="card"><h3>Planned showtimes</h3>`;
  h+=up.length?up.map(o=>{const m=M[o.s.m];return `<div class="pitem"><img src="${esc(m.poster)}" alt=""><div class="b"><div data-m="${m.i}">${esc(m.title)}</div><small>${thBadge(o.s.th)} ${niceDate(o.s.local.slice(0,10))} · ${t12(o.s.local)}${o.s.aud!==""?" · Aud "+o.s.aud:""}${o.s.tags?" · "+esc(o.s.tags):""}</small><textarea class="note" rows="1" data-note="${o.p}" placeholder="Note (who's going, seats…)">${esc(o.x.note||"")}</textarea></div><div style="text-align:right"><div class="when">${relDays(o.s.local.slice(0,10))}</div><a class="btn" style="margin-top:6px;padding:3px 9px" href="${esc(bookUrl(o.s))}" target="_blank" rel="noopener">Book</a><br><button class="star" data-unplan="${o.p}" title="Remove">✕</button></div></div>`}).join(""):`<div class="empty-note">Tap any showtime and choose “Add to my plans”. Planned shows are highlighted everywhere and trigger a reminder banner the day before.</div>`;
  const gone=ps.length-up.length; if(gone) h+=`<div class="empty-note">${gone} past plan${gone>1?"s":""} hidden. <button class="chip" id="clearpast">Clear</button></div>`;
  const lost=Object.keys(store.plans).filter(p=>!perf[p]).length; if(lost) h+=`<div class="empty-note">${lost} planned show${lost>1?"s are":" is"} no longer listed by the theater (moved or cancelled). <button class="chip" id="clearlost">Clear</button></div>`;
  h+=`</section><section class="card"><h3>★ Starred movies</h3>`;
  h+=stars.length?stars.map(m=>{const sh=byMovie[m.i]||[], f=sh[0]?.local.slice(0,10), r=store.star[m.id];
    const status=!sh.length?"Not listed right now":f>TODAY()?`Starts ${niceDate(f)} (${relDays(f)})`:`Playing now · last listed ${niceDate(m.last)}`;
    return `<div class="pitem"><img src="${esc(m.poster)}" alt=""><div class="b"><div data-m="${m.i}">${esc(m.title)}</div><small>${status}</small><br><small>Remind me <select data-lead="${m.id}">${[1,3,7,14].map(n=>`<option value="${n}" ${+(r.lead??3)===n?"selected":""}>${n} day${n>1?"s":""}</option>`).join("")}</select> before it starts</small></div><button class="star on" data-star="${m.id}" title="Unstar">★</button></div>`}).join(""):`<div class="empty-note">Star a movie to track it. You get a reminder banner before it opens and when its run is ending.</div>`;
  h+=`</section></div>`;
  $("#view").innerHTML=h;
  bindCommon();
  $$("[data-unplan]").forEach(b=>b.onclick=()=>{delete store.plans[b.dataset.unplan];save();render()});
  $$("[data-note]").forEach(t=>t.oninput=()=>{store.plans[t.dataset.note].note=t.value;save()});
  $$("[data-lead]").forEach(s=>s.onchange=()=>{store.star[s.dataset.lead].lead=+s.value;save();reminders()});
  const cp=$("#clearpast"); if(cp) cp.onclick=()=>{ps.filter(o=>o.s.utc<=nowSec-3*3600).forEach(o=>delete store.plans[o.p]);save();render()};
  const cl=$("#clearlost"); if(cl) cl.onclick=()=>{Object.keys(store.plans).filter(p=>!perf[p]).forEach(p=>delete store.plans[p]);save();render()};
  $("#icsall").onclick=()=>downloadIcs(up.map(o=>o.s),"movie-plans.ics");
  $("#share").onclick=sharePlans;
}

function bindCommon(){
  $$("[data-m]").forEach(e=>{if(e.tagName!=="TR"&&!e.classList.contains("cell")) e.onclick=()=>openMovie(+e.dataset.m)});
  $$("[data-star]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();toggleStar(b.dataset.star)});
  $$(".time[data-p]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();openPop(b,b.dataset.p)});
}
function toggleStar(id){if(store.star[id]) delete store.star[id]; else {store.star[id]={lead:3,at:TODAY()}; toast("Starred. You'll get a reminder before it starts.")} save(); render(); if($("#scrim").classList.contains("show")) openMovie(M.find(m=>m.id===id).i, state.mday)}

// ---------- movie modal ----------
function openMovie(i,day){
  const m=M[i], filt=!!(byMovie[i]&&byMovie[i].length), sh=filt?byMovie[i]:ALL.filter(s=>s.m===i), days=[...new Set(sh.map(s=>s.local.slice(0,10)))];
  state.mday=day&&days.includes(day)?day:days[0];
  const nowSec=Date.now()/1000;
  const dayTimes=sh.filter(s=>s.local.startsWith(state.mday));
  $("#modal").innerHTML=`<button class="x" id="mx" aria-label="Close">×</button>
  <div class="mhead"><img src="${esc(m.poster)}" alt=""><div><h2>${esc(m.title)}</h2>
   <div class="meta">${(m.theatres||[0]).map(thBadge).join("")}${rtBadge(m)}${kindTag(m)}<span>${[rating(m),runtime(m),m.genre].filter(Boolean).join(" · ")}</span></div>
   <div class="muted" style="font-size:13px">${days.length} day${days.length>1?"s":""} listed · ${niceDate(days[0])}${days.length>1?" to "+niceDate(days[days.length-1]):""}</div>
   <div class="btns"><a class="btn pri" href="${esc(trailerUrl(m))}" target="_blank" rel="noopener">▶ ${m.trailer?"Trailer":"Find trailer"}</a>
   ${m.rtUrl?`<a class="btn" href="${esc(m.rtUrl)}" target="_blank" rel="noopener">🍅 Rotten Tomatoes</a>`:""}
   ${(m.pages||[]).map(([t,u])=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener"><span class="thd th${t}"></span>${esc(t===0?"Regal page":thShort(t)+" page")}</a>`).join("")}
   <button class="btn" data-star="${m.id}">${store.star[m.id]?"★ Starred":"☆ Star & remind"}</button></div>
   <p>${esc(m.desc)}</p>
   ${m.directors?`<p class="muted" style="font-size:13px">Directed by ${esc(m.directors)}${m.cast?"<br>With "+esc(m.cast):""}</p>`:""}
  </div></div>
  <div class="mbody"><h4>Pick a day</h4><div class="dates" id="mdates">${days.map(x=>{const dt=parseYmd(x);return `<button data-d="${x}" class="${x===state.mday?"on":""}"><small>${x===TODAY()?"Today":DOW[dt.getDay()]}</small><b>${dt.getDate()}</b><small>${MON[dt.getMonth()]}</small></button>`}).join("")}</div>
  <h4>${state.mday?niceDate(state.mday,true):""}</h4>${dayTimes.length?timesByTheatre(dayTimes,nowSec):'<span class="muted">No showtimes listed.</span>'}${filt?hiddenNote(i):""}</div>`;
  $("#scrim").classList.add("show"); document.body.style.overflow="hidden";
  $("#mx").onclick=closeModal;
  const on=$("#mdates .on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  $$("#mdates button").forEach(b=>b.onclick=()=>openMovie(i,b.dataset.d));
  $$("#modal [data-star]").forEach(b=>b.onclick=()=>toggleStar(b.dataset.star));
  $$("#modal .time").forEach(b=>b.onclick=ev=>{ev.stopPropagation();openPop(b,b.dataset.p)});
  history.replaceState(null,"","#m="+m.id+(state.mday?"&d="+state.mday:""));
}
function hiddenNote(i){const n=ALL.filter(s=>s.m===i&&!thOn(s.th)).length; if(!n) return "";
  const names=[...new Set(ALL.filter(s=>s.m===i&&!thOn(s.th)).map(s=>thShort(s.th)))].join(", ");
  return `<p class="muted" style="font-size:12.5px;margin-top:10px">Also playing at ${esc(names)} (${n} show${n>1?"s":""}), hidden by your theater filter.</p>`}
function closeModal(){$("#scrim").classList.remove("show");document.body.style.overflow="";closePop();history.replaceState(null,"",location.pathname+location.search)}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#pop").classList.contains("show"))closePop();else closeModal()}});

// ---------- showtime popover ----------
function openPop(btn,p){
  const s=perf[p], m=M[s.m], pop=$("#pop"), planned=!!store.plans[p];
  pop.innerHTML=`<h5>${esc(m.title)}</h5><div class="sub">${thBadge(s.th)} ${niceDate(s.local.slice(0,10),true)} · ${t12(s.local)}${audText(s)?" · "+audText(s):""}<br>${esc(thName(s))}${s.tags?"<br>"+esc(s.tags):""}</div>
   <a class="btn pri" href="${esc(bookUrl(s))}" target="_blank" rel="noopener">${bookLabel(s)}</a>
   <button class="btn" id="pplan">${planned?"✓ In my plans (remove)":"＋ Add to my plans"}</button>
   <div class="row2"><a class="btn" href="${esc(gcalUrl(s))}" target="_blank" rel="noopener">Google Cal</a><button class="btn" id="pics">Apple / .ics</button></div>`;
  pop.classList.add("show");
  if(innerWidth>760){const r=btn.getBoundingClientRect();let x=Math.min(r.left,innerWidth-290),y=r.bottom+6;if(y+230>innerHeight)y=Math.max(10,r.top-236);pop.style.left=x+"px";pop.style.top=y+"px"}
  $("#pplan").onclick=()=>{if(store.plans[p]) delete store.plans[p]; else {store.plans[p]={note:"",at:TODAY()};toast("Added to your plans")} save(); closePop(); if($("#scrim").classList.contains("show")) openMovie(s.m,s.local.slice(0,10)); render()};
  $("#pics").onclick=()=>{downloadIcs([s],slugName(m.title)+".ics");closePop()};
}
function closePop(){$("#pop").classList.remove("show")}
document.addEventListener("click",e=>{if(!e.target.closest("#pop")&&!e.target.closest(".time"))closePop()});

// ---------- calendar ----------
const pad=n=>String(n).padStart(2,"0");
function utcStamp(sec){const d=new Date(sec*1000);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z"}
function endSec(s){return s.utc+((M[s.m].runtime||120)+(s.th===0?PREVIEWS:10))*60}
function slugName(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)}
function where(s){return TH[s.th].name+", "+TH[s.th].address}
function details(s){const m=M[s.m];return `${thName(s)}${audText(s)?", "+audText(s).toLowerCase():""}${s.tags?" ("+s.tags+")":""}.${m.runtime?" Runtime "+runtime(m)+(s.th===0?" plus about "+PREVIEWS+" min of previews":"")+".":""}\nTickets: ${bookUrl(s)}\nTrailer: ${trailerUrl(m)}`}
function gcalUrl(s){const m=M[s.m];return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(m.title+" (movie)")+"&dates="+utcStamp(s.utc)+"/"+utcStamp(endSec(s))+"&details="+encodeURIComponent(details(s))+"&location="+encodeURIComponent(where(s))}
function icsEsc(t){return t.replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1")}
function fold(l){const o=[];while(l.length>74){o.push(l.slice(0,74));l=" "+l.slice(74)}o.push(l);return o.join("\r\n")}
function downloadIcs(list,name){
  if(!list.length) return;
  const now=utcStamp(Date.now()/1000);
  const ev=list.map(s=>["BEGIN:VEVENT",`UID:${s.th===0?"regal-0758-":""}${s.perf}@oldmill-movies`,`DTSTAMP:${now}`,`DTSTART:${utcStamp(s.utc)}`,`DTEND:${utcStamp(endSec(s))}`,
    `SUMMARY:${icsEsc(M[s.m].title+" (movie)")}`,`LOCATION:${icsEsc(where(s))}`,`DESCRIPTION:${icsEsc(details(s))}`,`URL:${bookUrl(s)}`,
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Movie in 1 hour","TRIGGER:-PT60M","END:VALARM","END:VEVENT"].map(fold).join("\r\n"));
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bend Movies//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",...ev,"END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

// ---------- sharing (via link; no accounts) ----------
function sharePlans(){
  const nowSec=Date.now()/1000, p=plannedShows().filter(o=>o.s.utc>nowSec).map(o=>o.p), st=Object.keys(store.star);
  const url=location.origin+location.pathname+"#share="+encodeURIComponent(JSON.stringify({p,s:st}));
  const txt="My movie plans in Bend:\n"+plannedShows().filter(o=>o.s.utc>nowSec).map(o=>`• ${M[o.s.m].title}, ${thShort(o.s.th)}, ${niceDate(o.s.local.slice(0,10))} ${t12(o.s.local)}`).join("\n");
  if(navigator.share) navigator.share({title:"Movie plans",text:txt,url}).catch(()=>{});
  else navigator.clipboard?.writeText(txt+"\n"+url).then(()=>toast("Link copied"),()=>prompt("Copy this link",url));
}
function importShare(raw){
  let o;try{o=JSON.parse(decodeURIComponent(raw))}catch(e){return}
  const p=(o.p||[]).filter(x=>perf[x]), s=(o.s||[]).filter(id=>M.some(m=>m.id===id));
  if(!p.length&&!s.length) return;
  const names=[...p.map(x=>M[perf[x].m].title+", "+thShort(perf[x].th)+", "+niceDate(perf[x].local.slice(0,10))+" "+t12(perf[x].local)),...s.map(id=>"★ "+M.find(m=>m.id===id).title)];
  if(confirm("A friend shared these movie plans:\n\n"+names.join("\n")+"\n\nAdd them to your plans in this browser?")){
    p.forEach(x=>store.plans[x] ||= {note:"Shared by a friend",at:TODAY()}); s.forEach(id=>store.star[id] ||= {lead:3,at:TODAY()}); save(); state.view="plans";
  }
  history.replaceState(null,"",location.pathname+location.search);
}

// ---------- misc ----------
let tt; function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
$$("#tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render();scrollTo(0,0)});
$$("#filters .chip[data-k],#filters .chip[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,f=b.dataset.f;if(k){state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k)}else{state.flags.has(f)?state.flags.delete(f):state.flags.add(f)}render()});
let qt; $("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase();render()},150)});
let rw=innerWidth; addEventListener("resize",()=>{if(Math.abs(innerWidth-rw)>80&&state.view==="timeline"){rw=innerWidth;render()}});

async function boot(){
  let data=null;
  try{const r=await fetch("data/movies.json",{cache:"no-cache"}); if(r.ok){data=await r.json(); try{localStorage.setItem(KEY+".data",JSON.stringify(data))}catch(e){}}}catch(e){}
  if(!data){try{data=JSON.parse(localStorage.getItem(KEY+".data"))}catch(e){} if(data) setTimeout(()=>toast("Offline: showing saved showtimes"),400)}
  if(!data){$("#view").innerHTML="<p>Couldn't load showtimes. Check your connection and reload.</p>";return}
  ingest(data); updateCount();
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("share")) importShare(h.get("share"));
  render();
  if(h.get("m")){const m=M.find(x=>x.id===h.get("m")); if(m&&byMovie[m.i]) openMovie(m.i,h.get("d"))}
}
boot();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
